[tools]
go = "1.25.1"
node = "20"

[tasks.fix]
description = "Auto-applies Golang fixes"
run = "go fix ./..."

[tasks.format]
description = "Run go fix, then format code with goimports"
depends = ["fix"]
run = "go tool golang.org/x/tools/cmd/goimports -w . && go tool mvdan.cc/gofumpt -w ."

[tasks.fmt]
description = "Alias for format"
depends = ["format"]

[tasks.build]
description = "Build the application binary"
depends = ["fix"]
run = "go build -o copilot-oauth-proxy ./cmd/copilot-oauth-proxy"

[tasks.run]
description = "Run the application directly"
run = "go run ./cmd/copilot-oauth-proxy/main.go"

[tasks.test]
description = "Run all tests"
run = "go test ./..."
